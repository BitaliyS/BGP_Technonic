# Прод: https://app.legaltech-radar.tech
# Caddy сам выпускает Let's Encrypt при старте (нужны открытые 80/443).
#
# Запуск на сервере:
#   git clone … && cd …
#   cp deploy/.env.prod.example .env.prod   # заполнить секреты
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-technonicol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-technonicol}
    volumes:
      - tn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-technonicol} -d ${POSTGRES_DB:-technonicol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-technonicol}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-technonicol}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      UPLOAD_DIR: /data/uploads
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - tn_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Браузер ходит на тот же хост; /api проксирует Caddy
        NEXT_PUBLIC_API_URL: https://app.legaltech-radar.tech
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tn_caddy_data:/data
      - tn_caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  tn_pgdata:
  tn_uploads:
  tn_caddy_data:
  tn_caddy_config:
