# Прод за существующим Traefik на сервере (80/443 уже у traefik).
# Домен: https://app.legaltech-radar.tech
#
#   cp deploy/.env.prod.example .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-technonicol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-technonicol}
    volumes:
      - tn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-technonicol} -d ${POSTGRES_DB:-technonicol}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-technonicol}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-technonicol}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      UPLOAD_DIR: /data/uploads
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - tn_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.tn-api.rule=Host(`app.legaltech-radar.tech`) && PathPrefix(`/api`)
      - traefik.http.routers.tn-api.entrypoints=websecure
      - traefik.http.routers.tn-api.tls=true
      - traefik.http.routers.tn-api.tls.certresolver=le
      - traefik.http.routers.tn-api.priority=100
      - traefik.http.services.tn-api.loadbalancer.server.port=8000
      # HTTP → HTTPS
      - traefik.http.routers.tn-api-http.rule=Host(`app.legaltech-radar.tech`) && PathPrefix(`/api`)
      - traefik.http.routers.tn-api-http.entrypoints=web
      - traefik.http.routers.tn-api-http.middlewares=tn-https-redirect
      - traefik.http.routers.tn-api-http.priority=100
      - traefik.http.middlewares.tn-https-redirect.redirectscheme.scheme=https

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://app.legaltech-radar.tech
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.tn-web.rule=Host(`app.legaltech-radar.tech`)
      - traefik.http.routers.tn-web.entrypoints=websecure
      - traefik.http.routers.tn-web.tls=true
      - traefik.http.routers.tn-web.tls.certresolver=le
      - traefik.http.routers.tn-web.priority=1
      - traefik.http.services.tn-web.loadbalancer.server.port=3000
      - traefik.http.routers.tn-web-http.rule=Host(`app.legaltech-radar.tech`)
      - traefik.http.routers.tn-web-http.entrypoints=web
      - traefik.http.routers.tn-web-http.middlewares=tn-https-redirect
      - traefik.http.routers.tn-web-http.priority=1

volumes:
  tn_pgdata:
  tn_uploads:

networks:
  internal:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
